<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sun Rays AI</title>
<style>
  :root {
    --bg-deep: #030712;
    --bg-panel: rgba(10, 20, 40, 0.75);
    --neon: #4fd1ff;
    --neon-soft: #7be3ff;
    --text: #eaf6ff;
    --muted: #8fa8c2;
    --border-glow: rgba(79, 209, 255, 0.5);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg-deep);
    overflow-x: hidden;
  }
  #particles {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(79,209,255,0.08), transparent 40%),
      radial-gradient(circle at 80% 0%, rgba(79,209,255,0.08), transparent 40%),
      radial-gradient(circle at 50% 100%, rgba(79,209,255,0.06), transparent 50%),
      var(--bg-deep);
  }
  .page {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }

  .frame {
    position: relative;
    width: 100%;
    max-width: 760px;
    border: 1px solid var(--border-glow);
    border-radius: 18px;
    background: var(--bg-panel);
    box-shadow:
      0 0 0 1px rgba(79,209,255,0.15),
      0 0 40px rgba(79,209,255,0.15),
      inset 0 0 60px rgba(79,209,255,0.05);
    padding: 36px 32px;
    backdrop-filter: blur(6px);
  }

  .bot-badge {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 6px;
  }
  .bot-icon {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    filter: drop-shadow(0 0 8px var(--neon-soft));
    animation: floatBot 3.5s ease-in-out infinite;
  }
  @keyframes floatBot {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-4px); }
  }
  h1 {
    font-size: 1.7rem;
    margin: 0;
    letter-spacing: 0.5px;
    color: var(--text);
    text-shadow: 0 0 12px rgba(79,209,255,0.6);
  }
  .subtitle {
    color: var(--muted);
    margin: 4px 0 22px 56px;
    font-size: 0.95rem;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 22px;
  }
  .chip {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid rgba(79,209,255,0.35);
    background: rgba(79,209,255,0.06);
    color: var(--neon-soft);
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .chip:hover {
    background: rgba(79,209,255,0.15);
    box-shadow: 0 0 10px rgba(79,209,255,0.3);
  }

  .search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 26px;
  }
  input[type="text"] {
    flex: 1;
    padding: 15px 18px;
    border-radius: 12px;
    border: 1px solid rgba(79,209,255,0.35);
    background: rgba(4, 12, 28, 0.8);
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: box-shadow 0.2s, border-color 0.2s;
  }
  input[type="text"]:focus {
    border-color: var(--neon);
    box-shadow: 0 0 0 3px rgba(79,209,255,0.2), 0 0 18px rgba(79,209,255,0.3);
  }
  input[type="text"]::placeholder { color: #5f7690; }

  button {
    padding: 15px 26px;
    border-radius: 12px;
    border: 1px solid var(--neon);
    background: linear-gradient(135deg, #1c6fa8, #0d3a5c);
    color: #eaf9ff;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    box-shadow: 0 0 14px rgba(79,209,255,0.35);
    transition: transform 0.15s, box-shadow 0.2s;
  }
  button:hover:not(:disabled) {
    box-shadow: 0 0 22px rgba(79,209,255,0.55);
    transform: translateY(-1px);
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .card {
    background: rgba(6, 16, 34, 0.7);
    border: 1px solid rgba(79,209,255,0.25);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 0 20px rgba(79,209,255,0.08);
  }
  .card h2 {
    font-size: 1rem;
    margin: 0 0 14px;
    color: var(--neon-soft);
    text-shadow: 0 0 8px rgba(79,209,255,0.4);
  }
  .snippet {
    padding: 11px 0;
    border-bottom: 1px solid rgba(79,209,255,0.12);
    font-size: 0.95rem;
    line-height: 1.55;
    color: #d7ecfb;
    white-space: pre-wrap;
  }
  .snippet:last-child { border-bottom: none; }
  .cursor-blink {
    display: inline-block;
    width: 8px;
    height: 1em;
    background: var(--neon-soft);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.8s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .source {
    padding: 10px 0;
    border-bottom: 1px solid rgba(79,209,255,0.12);
  }
  .source:last-child { border-bottom: none; }
  .source a {
    color: var(--neon-soft);
    text-decoration: none;
    font-size: 0.9rem;
  }
  .source a:hover { text-decoration: underline; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .status { color: var(--neon-soft); margin-bottom: 16px; font-size: 0.95rem; }
  .error { color: #ff8a8a; border-color: rgba(255,138,138,0.3); }
</style>
</head>
<body>
  <canvas id="particles"></canvas>

  <div class="page">
    <div class="frame">
      <div class="bot-badge">
        <svg class="bot-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="30" fill="none" stroke="#4fd1ff" stroke-width="1.5" opacity="0.4"/>
          <rect x="16" y="20" width="32" height="26" rx="8" fill="none" stroke="#7be3ff" stroke-width="2"/>
          <circle cx="24" cy="33" r="4" fill="#4fd1ff"/>
          <circle cx="40" cy="33" r="4" fill="#4fd1ff"/>
          <line x1="32" y1="10" x2="32" y2="20" stroke="#7be3ff" stroke-width="2"/>
          <circle cx="32" cy="8" r="3" fill="#4fd1ff"/>
          <line x1="16" y1="30" x2="8" y2="26" stroke="#7be3ff" stroke-width="2"/>
          <line x1="48" y1="30" x2="56" y2="26" stroke="#7be3ff" stroke-width="2"/>
        </svg>
        <h1>Sun Rays AI</h1>
      </div>
      <p class="subtitle">Ask anything — it searches the web and brings back an answer.</p>

      <div class="chips" id="chips">
        <div class="chip" data-q="Latest technology news">Latest tech news</div>
        <div class="chip" data-q="Weather today">Weather today</div>
        <div class="chip" data-q="Interesting facts about space">Space facts</div>
        <div class="chip" data-q="How does AI work">How does AI work</div>
      </div>

      <div class="search-box">
        <input type="text" id="question" placeholder="Ask me anything..." autofocus />
        <button id="askBtn">Ask</button>
      </div>

      <div id="status" class="status"></div>
      <div id="results"></div>
    </div>
  </div>

  <script>
    // ---------- Particle background ----------
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    const mouse = { x: -9999, y: -9999 };
    window.addEventListener("mousemove", (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    function initParticles() {
      particles = [];
      const count = Math.min(90, Math.floor((window.innerWidth * window.innerHeight) / 16000));
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.6 + 0.4,
          vx: (Math.random() - 0.5) * 0.15,
          vy: (Math.random() - 0.5) * 0.15,
          baseAlpha: Math.random() * 0.5 + 0.2,
        });
      }
    }
    initParticles();
    window.addEventListener("resize", initParticles);

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;

        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        let glow = p.baseAlpha;
        let radius = p.r;
        if (dist < 120) {
          const boost = (120 - dist) / 120;
          glow = Math.min(1, p.baseAlpha + boost * 0.8);
          radius = p.r + boost * 1.8;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(125, 227, 255, ${glow})`;
        ctx.shadowColor = "rgba(79,209,255,0.8)";
        ctx.shadowBlur = dist < 120 ? 8 : 2;
        ctx.fill();
      }
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // ---------- Chat logic ----------
    const input = document.getElementById("question");
    const btn = document.getElementById("askBtn");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const chips = document.querySelectorAll(".chip");

    chips.forEach((chip) => {
      chip.addEventListener("click", () => {
        input.value = chip.getAttribute("data-q");
        ask();
      });
    });

    function typeText(el, text, speed = 12) {
      return new Promise((resolve) => {
        let i = 0;
        const cursor = document.createElement("span");
        cursor.className = "cursor-blink";
        el.appendChild(cursor);

        function step() {
          if (i < text.length) {
            cursor.insertAdjacentText("beforebegin", text[i]);
            i++;
            setTimeout(step, speed);
          } else {
            cursor.remove();
            resolve();
          }
        }
        step();
      });
    }

    async function ask() {
      const question = input.value.trim();
      if (!question) return;

      btn.disabled = true;
      statusEl.textContent = "🔎 Searching the internet...";
      resultsEl.innerHTML = "";

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();

        statusEl.textContent = "";

        if (data.error) {
          resultsEl.innerHTML = `<div class="card error">❌ ${data.error}</div>`;
          return;
        }

        const answerCard = document.createElement("div");
        answerCard.className = "card";
        answerCard.innerHTML = `<h2>🤖 Answer</h2>`;

        if (data.sources && data.sources.length > 0) {
          const p = document.createElement("p");
          p.className = "muted";
          p.textContent = `Based on internet search results for: "${data.question}"`;
          answerCard.appendChild(p);
        }

        resultsEl.appendChild(answerCard);

        for (const s of data.snippets) {
          const snippetEl = document.createElement("div");
          snippetEl.className = "snippet";
          answerCard.appendChild(snippetEl);
          await typeText(snippetEl, s, 6);
        }

        if (data.sources && data.sources.length > 0) {
          let html = `<div class="card"><h2>🔗 Sources</h2>`;
          data.sources.forEach((s, i) => {
            html += `<div class="source">${i + 1}. <a href="${s.url}" target="_blank" rel="noopener">${s.title}</a></div>`;
          });
          html += `</div>`;
          resultsEl.insertAdjacentHTML("beforeend", html);
        }
      } catch (e) {
        statusEl.textContent = "";
        resultsEl.innerHTML = `<div class="card error">❌ Something went wrong: ${e}</div>`;
      } finally {
        btn.disabled = false;
      }
    }

    btn.addEventListener("click", ask);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") ask();
    });
  </script>
</body>
</html>
